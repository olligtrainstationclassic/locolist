<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrainStation List of All Locomotives</title>
    <meta name="theme-color" content="#0b0f14">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- Tabulator & Google Fonts -->
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Chakra+Petch:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style> 
 :root {
            --primary: #00d1ff;
            --bg-dark: #05070a;
            --panel-bg: #0d1117;
            --border-glow: 0 0 15px rgba(0, 209, 255, 0.6);
            --muted: #8aa0b2;
        }

        body {
            background-color: var(--bg-dark);
            color: #e6edf3;
            font-family: 'Roboto Mono', Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .header-container {
            background: #000;
            padding: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--primary);
        }

        .header-img {
            max-height: 120px;
            filter: drop-shadow(0 0 15px var(--primary));
        }

        .topbar {
            background: #0a0c10;
            padding: 20px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #30363d;
        }

        .search-wrapper { width: 100%; max-width: 600px; }

        input#search {
            width: 100%;
            background: #000;
            color: var(--primary);
            border: 1px solid #30363d;
            border-radius: 25px;
            padding: 12px 25px;
            outline: none;
            font-size: 16px;
        }

        input#search:focus {
            border-color: var(--primary);
}

        #table-container { padding: 0 10px; background: var(--bg-dark); }

        /* Tabulator Design-Korrekturen */
        .tabulator { background-color: transparent !important; border: none !important; }

        .tabulator-header {
            background-color: #0d1117 !important;
            color: var(--primary) !important;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 15px;
            letter-spacing: 0.7px;
            border-bottom: 2px solid var(--primary) !important;
            padding: 3px !important;
            
        }

        .tabulator-col {
            background-color: #0d1117 !important;
            border-right: 1px solid #30363d !important;
        }

        .tabulator-row {
            background-color: #0d1117 !important;
            border-bottom: 1px solid #21262d !important;
            color: #c9d1d9 !important;
        }

        .tabulator-row-even { background-color: #161b22 !important; }

        .tabulator-row:hover {
        border-bottom: 1px solid var(--primary) !important;
            outline: 1px solid var(--primary);
        }

        .tabulator-cell {
            padding: 12px !important;
            border-right: 1px solid #30363d !important;
        }

                @media (max-width: 900px) {
            .search-info-wrapper { flex-direction: column; }
            .header-img { max-height: 80px; }
        }
</style>
</head>
<body>

<div class="header-container">
    <div class="header-box">
        <img src="header-locolist.png" class="header-img" alt="Logo">

    </div>
</div>

<div class="topbar">
    <div class="search-wrapper">
        <input id="search" placeholder="Search Locomotives, Rarity, Type...">
                    <span style="color:var(--muted); font-size: 12px;">🔄 Last update 2026-08-21 by Olli G."</span>
    </div>
</div>

<div id="table-container">
    <div id="loco-table"></div>
</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRlFUj4Krq7L1BBmvS_-EGxgrAdy9HuHA-EIGrkByiyt-13rwnXb02LGSMbYh_CCmUZ_qpZYR-3kXdA/pub?output=xlsx";
let table;

function loadData() {
    fetch(sheetURL)
    .then(res => res.arrayBuffer())
    .then(data => {
        const workbook = XLSX.read(data, {type: 'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        
        // Rohdaten als Array von Arrays lesen
        const rawRows = XLSX.utils.sheet_to_json(sheet, {header: 1});

        // Die erste Zeile überspringen (das "ALL LOCOMOTIVES..." Label)
        // Die zweite Zeile (Index 1) sind unsere echten Header
        const headerNames = rawRows[1];
        const dataRows = rawRows.slice(2); // Die eigentlichen Daten ab Zeile 3

        // Daten für Tabulator aufbereiten
        const formattedData = dataRows.map(row => {
            let obj = {};
            headerNames.forEach((h, i) => {
                obj[h] = row[i] || "";
            });
            return obj;
        });

        const columns = headerNames.map(name => ({
            title: name,
            field: name,
            headerSort: true,
            hozAlign: "left",
            formatter: "html"
        }));

        table = new Tabulator("#loco-table", {
            data: formattedData,
            layout: "fitColumns",
            columns: columns,
            height: "calc(100vh - 220px)",
        });
    });
}

document.getElementById("search").addEventListener("keyup", function() {
    let val = this.value.toLowerCase();
    if(table) table.setFilter(data => Object.values(data).some(v => String(v).toLowerCase().includes(val)));
});

loadData();
</script>
</body>
</html>
