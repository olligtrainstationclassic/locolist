<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="TrainStation List of All Locomotives">
    <meta property="og:type" content="website">
    <meta property="og:description" content="List of All Locomotives in the TrainStation Classic Game">
    <meta property="og:image" content="https://olligtrainstationclassic.github.io/locolist/preview-locolist.png">
    <meta property="og:url" content="https://olligtrainstationclassic.github.io/locolist">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>TrainStation List of All Locomotives</title>

        <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="96x96" />
    <meta name="theme-color" content="#0a0c10">

    <!-- Tabulator & Google Fonts -->
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Chakra+Petch:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
         :root {
            --primary: #00d1ff;
            --bg-dark: #0a0c10;
            --panel-bg: #161b22;
            --border-glow: #00d1ff;
            --muted: #8aa0b2;
        }

        body {
            background-color: var(--bg-dark);
            color: #c9d1d9
            font-family: 'Roboto Mono', Arial, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Header */
        .header-container {
            background: linear-gradient(rgba(10, 12, 16, 0.6), rgba(10, 12, 16, 0.6)), 
                        radial-gradient(circle at center, #1c2128 0%, #0a0c10 100%);
            border-bottom: 1px solid var(--primary);
            box-shadow: var(--border-glow);
            text-align: center;
            padding: 20px 0;
        }

        .header-img { max-height: 120px;
        filter: drop-shadow(0 0 15px var(--primary));
     }

        .topbar {
            background: var(--panel-bg);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }
        input#search {
            width: 100%;
            max-width: 500px;
            background: #0d1117;
            color: var(--primary);
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 10px 20px;
            margin-right: 20px;
            outline: none;
            font-family: 'Roboto Mono', monospace;
        }

                    input#search:focus {
            border-color: var(--primary);
            box-shadow: var(--border-glow);
        }

        .tabulator { 
            background-color: transparent !important; 
            border: none !important; 
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
        }

        .tabulator-header {
            background-color: #0d1117 !important;
            color: var(--primary) !important;
            font-family: 'Chakra Petch', sans-serif;
            letter-spacing: .1em;
            font-size: 15px;
            border-bottom: 2px solid var(--primary) !important;
            padding: 4px 0px;
        }

        .tabulator-col {
            background-color: #0d1117 !important;
            border-right: 1px solid #30363d !important;
        }

        /* Zentrierung der Header-Titel */
        .header-center .tabulator-col-content {
            text-align: center !important;
        }

        .tabulator-row { 
            background-color: #161b22 !important; 
            color: #c9d1d9 !important; 
            border-bottom: 1px solid #30363d !important; }
        .tabulator-row-even { 
            background-color: #0d1117 !important; }
        
        .tabulator-row:hover {
        border-bottom: 1px solid var(--primary) !important;
            outline: 1px solid var(--primary);
        }

        .tabulator-cell { 
            padding: 12px 8px !important; 
            border-right: 1px solid #30363d !important;
        }

        /* BREITE SCROLLBAR */
        .tabulator-tableholder::-webkit-scrollbar { width: 18px; height: 18px; }
        .tabulator-tableholder::-webkit-scrollbar-track { background: #0a0c10; }
        .tabulator-tableholder::-webkit-scrollbar-thumb { 
            background: #30363d; 
            border-radius: 10px; 
            border: 3px solid #0a0c10;
        }
        .tabulator-tableholder::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        
        @media (max-width: 900px) {
            .search-info-wrapper { flex-direction: column; }
            .header-img { max-height: 50px; }
        }
        
    </style>
</head>
<body>

<div class="header-container">
    
        <img src="header-locolist.png" class="header-img" alt="Logo">
        
    </div>
</div>

<div class="topbar">
    <input id="search" placeholder="Search Name, Era, Rarity ...">
<span style="color:var(--muted); font-size: 10px;">🔄 Last update 2026-08-21 by Olli G.</span>
</div>

<div id="table-container">
    <div id="loco-table"></div>
</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRlFUj4Krq7L1BBmvS_-EGxgrAdy9HuHA-EIGrkByiyt-13rwnXb02LGSMbYh_CCmUZ_qpZYR-3kXdA/pub?output=xlsx";

function loadData() {
    fetch(sheetURL)
    .then(res => res.arrayBuffer())
    .then(data => {
        const workbook = XLSX.read(data, {type: 'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawRows = XLSX.utils.sheet_to_json(sheet, {header: 1});

        const headerNames = rawRows[1];
        const dataRows = rawRows.slice(2);

        const formattedData = dataRows.map(row => {
            let obj = {};
            headerNames.forEach((h, i) => { obj[h] = row[i] || ""; });
            return obj;
        });

        const columns = headerNames.map(name => {
            let config = { 
                title: name, 
                field: name, 
                headerSort: true,
                resizable: false,
                vertAlign: "middle"
            };

            const n = name.toLowerCase();
            
            if (n.includes("id")) { 
                config.width = 75; 
                config.sorter = "number";
                config.hozAlign = "center";
                config.headerHozAlign = "center"; // Header Titel zentriert
                config.cssClass = "header-center";
            }
            else if (n.includes("era")) { config.width = 110; }
            else if (n.includes("rarity")) { config.width = 100; }
            else if (n.includes("power")) { 
                config.width = 90; 
                config.hozAlign = "center";
                config.headerHozAlign = "center"; // Header Titel zentriert
                config.cssClass = "header-center";
            }
            else if (n.includes("museum")) { 
                config.width = 140; // Erhöht für "In Museum?"
                config.hozAlign = "center";
                config.headerHozAlign = "center"; // Header Titel zentriert
                config.cssClass = "header-center";
            }
            else { 
                config.widthGrow = 1;
                config.minWidth = 150; 
            }

            return config;
        });

        const table = new Tabulator("#loco-table", {
            data: formattedData,
            layout: "fitColumns",
            columns: columns,
            height: "calc(100vh - 155px)",
            initialSort: [{column: headerNames[0], dir: "asc"}],
        });

        document.getElementById("search").addEventListener("keyup", function() {
            let val = this.value.toLowerCase();
            table.setFilter(data => Object.values(data).some(v => String(v).toLowerCase().includes(val)));
        });
    });
}

loadData();
</script>
</body>
</html>
