<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrainStation List of All Locomotives</title>
    <meta name="theme-color" content="#0b0f14">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- Tabulator & Google Fonts -->
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>

<div class="header-container">
    <div class="header-box">
        <img src="header-locolist.png" class="header-img" alt="Logo">

    </div>
</div>

<div class="topbar">
    <div class="search-wrapper">
        <input id="search" placeholder="Search Locomotives, Rarity, Type...">
    </div>
</div>

<div id="table-container">
    <div id="loco-table"></div>
</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRlFUj4Krq7L1BBmvS_-EGxgrAdy9HuHA-EIGrkByiyt-13rwnXb02LGSMbYh_CCmUZ_qpZYR-3kXdA/pub?output=xlsx";
let table;

function loadData() {
    fetch(sheetURL)
    .then(res => res.arrayBuffer())
    .then(data => {
        const workbook = XLSX.read(data, {type: 'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        
        // Rohdaten als Array von Arrays lesen
        const rawRows = XLSX.utils.sheet_to_json(sheet, {header: 1});

        // Die erste Zeile überspringen (das "ALL LOCOMOTIVES..." Label)
        // Die zweite Zeile (Index 1) sind unsere echten Header
        const headerNames = rawRows[1];
        const dataRows = rawRows.slice(2); // Die eigentlichen Daten ab Zeile 3

        // Daten für Tabulator aufbereiten
        const formattedData = dataRows.map(row => {
            let obj = {};
            headerNames.forEach((h, i) => {
                obj[h] = row[i] || "";
            });
            return obj;
        });

        const columns = headerNames.map(name => ({
            title: name,
            field: name,
            headerSort: true,
            hozAlign: "left",
            formatter: "html"
        }));

        table = new Tabulator("#loco-table", {
            data: formattedData,
            layout: "fitColumns",
            columns: columns,
            height: "calc(100vh - 220px)",
        });
    });
}

document.getElementById("search").addEventListener("keyup", function() {
    let val = this.value.toLowerCase();
    if(table) table.setFilter(data => Object.values(data).some(v => String(v).toLowerCase().includes(val)));
});

loadData();
</script>
</body>
</html>
